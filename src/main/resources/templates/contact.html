<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }

        .contact-form {
            max-width: 500px;
        }

        .contact-form label {
            display: block;
            margin-top: 16px;
        }

        .contact-form input,
        .contact-form textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
            margin-top: 6px;
        }

        .contact-form button {
            margin-top: 16px;
            padding: 8px 16px;
        }

        .error {
            color: #b00020;
        }

        .success {
            color: #166534;
        }
    </style>
</head>
<body>
<nav th:replace="~{menu :: menu}"></nav>

<h1>Contact us</h1>

<p class="success" th:if="${param.sent}">
    Your message was sent successfully.
</p>

<form class="contact-form"
      th:action="@{/contact}"
      th:object="${contactMessage}"
      method="post">

    <label for="name">Name</label>
    <input type="text" id="name" th:field="*{name}"
           maxlength="100" required>
    <p class="error" th:if="${#fields.hasErrors('name')}"
       th:errors="*{name}"></p>

    <label for="email">Email</label>
    <input type="email" id="email" th:field="*{email}"
           maxlength="254" required>
    <p class="error" th:if="${#fields.hasErrors('email')}"
       th:errors="*{email}"></p>

    <label for="message">Message</label>
    <textarea id="message" th:field="*{message}"
              rows="6" maxlength="5000" required></textarea>
    <p class="error" th:if="${#fields.hasErrors('message')}"
       th:errors="*{message}"></p>

    <button type="submit">Send message</button>
</form>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
