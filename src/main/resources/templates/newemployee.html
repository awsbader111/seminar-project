<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Pizza</title>
</head>
<body>
<nav th:replace="~{menu :: menu}"></nav>

<h1>Add pizza</h1>
<p style="color: red;" th:if="${error}" th:text="${error}"></p>

<form th:action="@{/admin/pizzas/save}"
      th:object="${pizza}" method="post">
    <p>
        <label for="pname">Pizza name</label>
        <input type="text" th:field="*{pname}"
               maxlength="255" required>
    </p>
    <p>
        <label for="categoryName">Category</label>
        <select id="categoryName" name="categoryName" required>
            <option value="">Choose a category</option>
            <option th:each="category : ${categories}"
                    th:value="${category.cname}"
                    th:text="${category.cname}">
            </option>
        </select>
    </p>
    <p>
        <input type="checkbox" th:field="*{vegetarian}">
        <label for="vegetarian">Vegetarian</label>
    </p>
    <p><input type="submit" value="Add"></p>
</form>

<a th:href="@{/admin/pizzas}">Back to pizzas</a>
</body>
</html>
