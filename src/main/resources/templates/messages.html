<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Messages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #eee;
        }

        .message {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
<nav th:replace="~{menu :: menu}"></nav>

<h1>Messages</h1>
<p>Messages are displayed newest first.</p>

<p th:if="${#lists.isEmpty(messages)}">No messages yet.</p>

<div class="table-container" th:unless="${#lists.isEmpty(messages)}">
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Message</th>
            <th>Submitted at</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="message : ${messages}">
            <td th:text="${message.name}"></td>
            <td th:text="${message.email}"></td>
            <td class="message" th:text="${message.message}"></td>
            <td th:text="${message.createdAt}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
