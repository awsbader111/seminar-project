<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="menu">

    <!-- Responsive Bootstrap theme -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/flatly/bootstrap.min.css">

    <!-- Our custom styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/database}">Database</a>
        <a th:href="@{/chart}">Chart</a>
        <a th:href="@{/contact}">Contact</a>

        <span sec:authorize="isAnonymous()">
            <a th:href="@{/register}">Register</a>
            <a th:href="@{/login}">Login</a>
        </span>

        <span sec:authorize="isAuthenticated()">
            <a th:href="@{/user}">User</a>
            <a th:href="@{/messages}">Messages</a>
        </span>

        <span sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin}">Admin</a>
        </span>

        <span sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </span>
    </nav>

</div>

</body>
</html>
